<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym & Habit Tracker</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Manifest inline -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Gym %26 Habit Tracker","short_name":"GymTrack","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2964/2964514.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: text; }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Skrytie predvolenej šípky prehliadača pre details */
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md shadow-blue-900/30">
        <i data-lucide="dumbbell" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">Gym & Habit Tracker</h1>
        <p class="text-xs text-slate-400" id="current-date-display"></p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openSettingsModal()" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition rounded-xl text-slate-300 border border-slate-700">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
      <button onclick="exportData()" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition rounded-xl text-slate-300 border border-slate-700">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Navigation Tabs -->
    <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
      <button onclick="switchTab('workout')" id="tab-btn-workout" class="py-2 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow">
        Tréning
      </button>
      <button onclick="switchTab('habits')" id="tab-btn-habits" class="py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
        Návyky
      </button>
      <button onclick="switchTab('history')" id="tab-btn-history" class="py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
        História
      </button>
    </div>

    <!-- TAB 1: WORKOUT -->
    <section id="tab-workout" class="space-y-4">
      <!-- Routine Selector -->
      <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button onclick="selectRoutine('A')" id="btn-routine-a" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700">
          Tréning A
        </button>
        <button onclick="selectRoutine('B')" id="btn-routine-b" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white">
          Tréning B
        </button>
      </div>

      <!-- Workout Cards Container -->
      <div id="workout-exercises-container" class="space-y-4">
        <!-- Injected via JS -->
      </div>

      <button onclick="finishWorkout()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-98 text-white font-bold rounded-xl shadow-lg shadow-blue-900/40 flex items-center justify-center gap-2">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Dokončiť Tréning
      </button>
    </section>

    <!-- TAB 2: HABITS -->
    <section id="tab-habits" class="space-y-6 hidden">
      <!-- Habits Header & Add Button -->
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          <i data-lucide="check-square" class="w-5 h-5 text-blue-400"></i> Dnešné Návyky
        </h2>
        <button onclick="openAddHabitModal()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl flex items-center gap-1 shadow">
          <i data-lucide="plus" class="w-4 h-4"></i> Spravovať návyky
        </button>
      </div>

      <!-- Habits Today List -->
      <div id="habits-today-list" class="space-y-3">
        <!-- Injected via JS -->
      </div>

      <!-- Calendar & Streaks Overview -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <button onclick="changeMonth(-1)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <h3 class="font-bold text-sm text-slate-100" id="calendar-month-title">August 2026</h3>
          <button onclick="changeMonth(1)" class="p-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Days Headers -->
        <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400 uppercase tracking-wider">
          <span>Po</span><span>Ut</span><span>St</span><span>Št</span><span>Pi</span><span>So</span><span>Ne</span>
        </div>

        <!-- Calendar Grid -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-1">
          <!-- Injected via JS -->
        </div>

        <!-- Legend / Active Habits Colors -->
        <div class="pt-2 border-t border-slate-800/80">
          <p class="text-[11px] font-semibold text-slate-400 mb-2">Legenda návykov:</p>
          <div id="habits-legend-list" class="flex flex-wrap gap-2 text-xs">
            <!-- Injected via JS -->
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 3: HISTORY -->
    <section id="tab-history" class="space-y-4 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h2 class="text-base font-bold text-white mb-3 flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-blue-400"></i> Odcvičené Tréningy
        </h2>
        <div id="history-list" class="space-y-3 text-xs">
          <!-- History items injected via JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL: SETTINGS (Edit Exercises) -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-blue-400"></i> Nastavenia Cvikov
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-6 custom-scrollbar text-xs">
        <div>
          <h4 class="font-bold text-blue-400 text-sm mb-3">Tréning A</h4>
          <div id="settings-exercises-a" class="space-y-2"></div>
        </div>
        <div>
          <h4 class="font-bold text-blue-400 text-sm mb-3">Tréning B</h4>
          <div id="settings-exercises-b" class="space-y-2"></div>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex gap-2">
        <button onclick="saveExerciseSettings()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white text-xs shadow">
          Uložiť Názvy Cvikov
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: HABIT MANAGEMENT -->
  <div id="modal-habits" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i data-lucide="edit-3" class="w-5 h-5 text-blue-400"></i> Spravovať Návyky
        </h3>
        <button onclick="closeAddHabitModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="p-4 overflow-y-auto space-y-5 custom-scrollbar text-xs">
        <!-- New Habit Form -->
        <div class="bg-slate-800/50 p-3 border border-slate-700/60 rounded-xl space-y-3">
          <h4 class="font-bold text-white text-xs" id="habit-form-title">Pridať Nový Návyk</h4>
          <input type="hidden" id="habit-edit-id" value="">
          <div>
            <label class="block text-slate-400 mb-1">Názov návyku:</label>
            <input type="text" id="habit-input-name" placeholder="napr. Vypiť 3L vody" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Farba návyku:</label>
            <div class="flex items-center gap-2" id="color-picker-container">
              <!-- Preset color dots -->
            </div>
          </div>
          <button onclick="saveHabit()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-lg text-white text-xs">
            Uložiť Návyk
          </button>
        </div>

        <!-- Existing Habits List -->
        <div class="space-y-2">
          <h4 class="font-bold text-slate-300 text-xs">Existujúce Návyky</h4>
          <div id="habit-manage-list" class="space-y-2">
            <!-- Injected via JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Colors preset palette
    const COLOR_PALETTE = [
      { name: 'Modrá', hex: '#3b82f6' },
      { name: 'Zelená', hex: '#10b981' },
      { name: 'Fialová', hex: '#8b5cf6' },
      { name: 'Oranžová', hex: '#f59e0b' },
      { name: 'Červená', hex: '#f43f5e' },
      { name: 'Tyrkysová', hex: '#06b6d4' }
    ];

    let selectedColorHex = COLOR_PALETTE[0].hex;

    // Default Initial Data
    const defaultData = {
      workoutA: [
        { id: 'a1', name: 'Hack squat / leg press', type: 'Veľký', sets: 2, minReps: 5, targetReps: 6, weight: 70, inc: 2.5, logs: [6, 6] },
        { id: 'a2', name: 'Romanian deadlift', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 90, inc: 2.5, logs: [8, 8] },
        { id: 'a3', name: 'Smith machine chest press 90 / dips', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 27, inc: 2.5, logs: [8, 8] },
        { id: 'a4', name: 'Weighted pull-up / Lat pulldown', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 0, inc: 2.5, logs: [6, 6] },
        { id: 'a5', name: 'Peck deck', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 80, inc: 2.5, logs: [8, 8] },
        { id: 'a6', name: 'Biceps curl (cable / incline)', type: 'Malý', sets: 2, minReps: 6, targetReps: 10, weight: 55, inc: 1.5, logs: [10, 10] },
        { id: 'a7', name: 'Back extension', type: 'Čas', sets: 1, minReps: 0, targetReps: 100, weight: 0, inc: 1.5, logs: [60] },
        { id: 'a8', name: 'Ab crunch', type: 'Malý', sets: 2, minReps: 12, targetReps: 12, weight: 47, inc: 1.5, logs: [12, 12] }
      ],
      workoutB: [
        { id: 'b1', name: 'Leg extension one leg', type: 'Veľký', sets: 2, minReps: 8, targetReps: 12, weight: 59, inc: 2.5, logs: [12, 12] },
        { id: 'b2', name: 'Chest-supported row / T-bar row', type: 'Veľký', sets: 3, minReps: 6, targetReps: 10, weight: 60, inc: 2.5, logs: [10, 10, 10] },
        { id: 'b3', name: 'Smith shoulder press', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 80, inc: 2.5, logs: [8, 8] },
        { id: 'b4', name: 'Seated leg curl', type: 'Veľký', sets: 2, minReps: 8, targetReps: 12, weight: 66, inc: 2.5, logs: [12, 12] },
        { id: 'b5', name: 'Seated good morning', type: 'Veľký', sets: 2, minReps: 8, targetReps: 12, weight: 25, inc: 2.5, logs: [12, 12] },
        { id: 'b6', name: 'Overhead triceps extension / 1 arm extension', type: 'Malý', sets: 2, minReps: 6, targetReps: 10, weight: 17, inc: 1.5, logs: [10, 10] },
        { id: 'b7', name: 'Lateral raise', type: 'Malý', sets: 1, minReps: 10, targetReps: 15, weight: 8, inc: 1.5, logs: [15] },
        { id: 'b8', name: 'Ab crunch', type: 'Malý', sets: 2, minReps: 12, targetReps: 12, weight: 12.5, inc: 1.5, logs: [12, 12] }
      ],
      habits: [
        { id: 'h1', name: 'Vypiť dostatok vody (3L)', color: '#3b82f6' },
        { id: 'h2', name: 'Išiel som spať na čas', color: '#8b5cf6' }
      ],
      habitLogs: {},
      history: []
    };

    let appState = JSON.parse(localStorage.getItem('gymTrackState')) || defaultData;
    if (!Array.isArray(appState.habits)) appState.habits = defaultData.habits;
    if (!appState.habitLogs) appState.habitLogs = {};
    if (!appState.history) appState.history = [];

    let activeRoutine = 'A';
    let calDisplayDate = new Date();

    function saveState() {
      localStorage.setItem('gymTrackState', JSON.stringify(appState));
    }

    function getTodayStr() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('sk-SK', { weekday: 'short', month: 'short', day: 'numeric' });
      renderWorkout();
      renderHabitsTab();
      renderHistory();
      renderColorPicker();
      lucide.createIcons();
    });

    // NAVIGATION TABS
    function switchTab(tab) {
      ['workout', 'habits', 'history'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = "py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      activeBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow";
    }

    // ROUTINE & WORKOUT LOGIC
    function selectRoutine(r) {
      activeRoutine = r;
      const btnA = document.getElementById('btn-routine-a');
      const btnB = document.getElementById('btn-routine-b');
      if (r === 'A') {
        btnA.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700 shadow";
        btnB.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white";
      } else {
        btnB.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700 shadow";
        btnA.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white";
      }
      renderWorkout();
    }

    function renderWorkout() {
      const list = activeRoutine === 'A' ? appState.workoutA : appState.workoutB;
      const container = document.getElementById('workout-exercises-container');
      container.innerHTML = '';

      list.forEach((ex, exIdx) => {
        let isCeilingMet = false;
        if (ex.type === 'Čas') {
          isCeilingMet = ex.logs[0] >= ex.targetReps;
        } else {
          isCeilingMet = ex.logs.length >= ex.sets && ex.logs.every(r => r >= ex.targetReps);
        }

        let nextWeightText = isCeilingMet ? `Cieľ splnený! Prihoď na ${ex.weight + ex.inc} kg` : `Nechaj ${ex.weight} kg`;

        let setInputsHTML = '';
        for (let s = 0; s < ex.sets; s++) {
          const currentVal = ex.logs[s] !== undefined ? ex.logs[s] : 0;
          setInputsHTML += `
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-slate-400 font-medium">S${s+1}:</span>
              <button onclick="changeReps('${activeRoutine}', ${exIdx}, ${s}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center text-sm border border-slate-700">-</button>
              <span class="w-8 text-center text-sm font-bold text-white">${currentVal}</span>
              <button onclick="changeReps('${activeRoutine}', ${exIdx}, ${s}, 1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center text-sm border border-slate-700">+</button>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-sm";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded ${ex.type === 'Veľký' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : ex.type === 'Malý' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20'}">
                  ${ex.type}
                </span>
                <span class="text-xs text-slate-400">${ex.sets} séria / cieľ ${ex.targetReps}${ex.type === 'Čas' ? 's' : ' op.'}</span>
              </div>
              <h3 class="font-bold text-sm text-slate-100 mt-1">${ex.name}</h3>
            </div>
            <div class="text-right">
              <div class="flex items-center justify-end gap-1">
                <button onclick="changeWeight('${activeRoutine}', ${exIdx}, -2.5)" class="text-slate-400 hover:text-white px-1 font-bold text-xs">-</button>
                <span class="text-base font-extrabold text-blue-400">${ex.weight} kg</span>
                <button onclick="changeWeight('${activeRoutine}', ${exIdx}, 2.5)" class="text-slate-400 hover:text-white px-1 font-bold text-xs">+</button>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-800/80">
            ${setInputsHTML}
          </div>

          <div class="mt-2 text-[11px] p-2 rounded-xl flex items-center gap-2 ${isCeilingMet ? 'bg-emerald-950/40 text-emerald-400 border border-emerald-800/40' : 'bg-slate-800/40 text-slate-400'}">
            <i data-lucide="${isCeilingMet ? 'trending-up' : 'minus'}" class="w-4 h-4 shrink-0"></i>
            <span>${nextWeightText}</span>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function changeReps(routine, exIdx, setIdx, delta) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      if (!list[exIdx].logs[setIdx]) list[exIdx].logs[setIdx] = 0;
      list[exIdx].logs[setIdx] = Math.max(0, list[exIdx].logs[setIdx] + delta);
      saveState();
      renderWorkout();
    }

    function changeWeight(routine, exIdx, delta) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      list[exIdx].weight = Math.max(0, list[exIdx].weight + delta);
      saveState();
      renderWorkout();
    }

    function finishWorkout() {
      const list = activeRoutine === 'A' ? appState.workoutA : appState.workoutB;
      
      const loggedExercises = list.map(e => ({
        name: e.name,
        weight: e.weight,
        logs: [...e.logs]
      }));

      list.forEach(ex => {
        let isCeilingMet = false;
        if (ex.type === 'Čas') {
          isCeilingMet = ex.logs[0] >= ex.targetReps;
        } else {
          isCeilingMet = ex.logs.length >= ex.sets && ex.logs.every(r => r >= ex.targetReps);
        }
        if (isCeilingMet) {
          ex.weight = ex.weight + ex.inc;
        }
      });

      const todayStr = new Date().toLocaleDateString('sk-SK');
      appState.history.unshift({
        date: todayStr,
        routine: activeRoutine,
        exercises: loggedExercises
      });

      saveState();
      alert(`Tréning ${activeRoutine} dokončený! Váhy sa automaticky upravili pre budúci tréning.`);
      renderWorkout();
      renderHistory();
    }

    // HABITS & STREAK LOGIC
    function toggleHabitToday(habitId) {
      const today = getTodayStr();
      if (!appState.habitLogs[today]) appState.habitLogs[today] = [];
      const idx = appState.habitLogs[today].indexOf(habitId);
      if (idx > -1) {
        appState.habitLogs[today].splice(idx, 1);
      } else {
        appState.habitLogs[today].push(habitId);
      }
      saveState();
      renderHabitsTab();
    }

    function calculateStreak(habitId) {
      let streak = 0;
      let checkDate = new Date();
      const isCompleted = (dStr) => appState.habitLogs[dStr] && appState.habitLogs[dStr].includes(habitId);

      let todayStr = formatDate(checkDate);
      if (!isCompleted(todayStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
        if (!isCompleted(formatDate(checkDate))) return 0;
      }

      while (true) {
        let dStr = formatDate(checkDate);
        if (isCompleted(dStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderHabitsTab() {
      const today = getTodayStr();
      const todayDone = appState.habitLogs[today] || [];
      const container = document.getElementById('habits-today-list');
      container.innerHTML = '';

      if (appState.habits.length === 0) {
        container.innerHTML = `<div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl text-center text-xs text-slate-500">Nemáš žiadne aktívne návyky. Klikni na "Spravovať návyky" vyššie.</div>`;
      } else {
        appState.habits.forEach(h => {
          const isDone = todayDone.includes(h.id);
          const streak = calculateStreak(h.id);

          const card = document.createElement('div');
          card.className = `p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${isDone ? 'bg-slate-900 border-slate-700' : 'bg-slate-900/60 border-slate-800'}`;
          card.onclick = () => toggleHabitToday(h.id);

          card.innerHTML = `
            <div class="flex items-center gap-3">
              <div class="w-6 h-6 rounded-lg flex items-center justify-center transition-all ${isDone ? 'text-white' : 'border border-slate-700'}" style="background-color: ${isDone ? h.color : 'transparent'}">
                ${isDone ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}
              </div>
              <div>
                <h4 class="font-bold text-sm text-slate-100">${h.name}</h4>
                <div class="flex items-center gap-1 text-[11px] text-amber-400 font-semibold mt-0.5">
                  <i data-lucide="flame" class="w-3.5 h-3.5 fill-amber-400"></i>
                  <span>${streak} dňový streak</span>
                </div>
              </div>
            </div>
            <div class="w-3 h-3 rounded-full" style="background-color: ${h.color}"></div>
          `;
          container.appendChild(card);
        });
      }

      renderCalendar();
      renderLegend();
      lucide.createIcons();
    }

    // CALENDAR VIEW LOGIC
    function changeMonth(delta) {
      calDisplayDate.setMonth(calDisplayDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = calDisplayDate.getFullYear();
      const month = calDisplayDate.getMonth();
      const monthNames = ["Január", "Február", "Marec", "Apríl", "Máj", "Jún", "Júl", "August", "September", "Október", "November", "December"];
      document.getElementById('calendar-month-title').innerText = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);
      
      let startingDay = firstDayOfMonth.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      const totalDays = lastDayOfMonth.getDate();

      for (let i = 0; i < startingDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-12 bg-slate-950/40 rounded-lg";
        grid.appendChild(emptyCell);
      }

      const todayStr = getTodayStr();

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const doneHabitIds = appState.habitLogs[dateStr] || [];
        const isToday = (dateStr === todayStr);

        const cell = document.createElement('div');
        cell.className = `h-12 p-1 bg-slate-800/40 border ${isToday ? 'border-blue-500 bg-blue-950/20' : 'border-slate-800/60'} rounded-lg flex flex-col justify-between`;

        let stripsHTML = '<div class="space-y-0.5 overflow-hidden max-h-6">';
        doneHabitIds.forEach(hId => {
          const habit = appState.habits.find(h => h.id === hId);
          if (habit) {
            stripsHTML += `<div class="h-1 rounded-full w-full" style="background-color: ${habit.color}"></div>`;
          }
        });
        stripsHTML += '</div>';

        cell.innerHTML = `
          <span class="text-[10px] font-bold ${isToday ? 'text-blue-400' : 'text-slate-400'}">${day}</span>
          ${stripsHTML}
        `;
        grid.appendChild(cell);
      }
    }

    function renderLegend() {
      const container = document.getElementById('habits-legend-list');
      container.innerHTML = '';
      appState.habits.forEach(h => {
        const item = document.createElement('div');
        item.className = "flex items-center gap-1.5 bg-slate-800/60 px-2 py-1 rounded-lg text-slate-300";
        item.innerHTML = `
          <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${h.color}"></div>
          <span class="truncate max-w-[120px]">${h.name}</span>
        `;
        container.appendChild(item);
      });
    }

    // MODAL HABIT MANAGEMENT
    function renderColorPicker() {
      const container = document.getElementById('color-picker-container');
      container.innerHTML = '';
      COLOR_PALETTE.forEach(c => {
        const dot = document.createElement('button');
        dot.type = "button";
        dot.className = `w-7 h-7 rounded-full transition-transform border-2 ${selectedColorHex === c.hex ? 'scale-110 border-white' : 'border-transparent'}`;
        dot.style.backgroundColor = c.hex;
        dot.onclick = () => {
          selectedColorHex = c.hex;
          renderColorPicker();
        };
        container.appendChild(dot);
      });
    }

    function openAddHabitModal() {
      document.getElementById('modal-habits').classList.remove('hidden');
      resetHabitForm();
      renderHabitsManageList();
    }

    function closeAddHabitModal() {
      document.getElementById('modal-habits').classList.add('hidden');
    }

    function resetHabitForm() {
      document.getElementById('habit-edit-id').value = '';
      document.getElementById('habit-input-name').value = '';
      document.getElementById('habit-form-title').innerText = 'Pridať Nový Návyk';
      selectedColorHex = COLOR_PALETTE[0].hex;
      renderColorPicker();
    }

    function saveHabit() {
      const name = document.getElementById('habit-input-name').value.trim();
      const editId = document.getElementById('habit-edit-id').value;

      if (!name) {
        alert('Zadaj názov návyku.');
        return;
      }

      if (editId) {
        const habit = appState.habits.find(h => h.id === editId);
        if (habit) {
          habit.name = name;
          habit.color = selectedColorHex;
        }
      } else {
        appState.habits.push({
          id: 'h_' + Date.now(),
          name: name,
          color: selectedColorHex
        });
      }

      saveState();
      resetHabitForm();
      renderHabitsManageList();
      renderHabitsTab();
    }

    function editHabit(id) {
      const habit = appState.habits.find(h => h.id === id);
      if (!habit) return;
      document.getElementById('habit-edit-id').value = habit.id;
      document.getElementById('habit-input-name').value = habit.name;
      document.getElementById('habit-form-title').innerText = 'Upraviť Návyk';
      selectedColorHex = habit.color;
      renderColorPicker();
    }

    function deleteHabit(id) {
      if (confirm('Naozaj chceš vymazať tento návyk?')) {
        appState.habits = appState.habits.filter(h => h.id !== id);
        saveState();
        renderHabitsManageList();
        renderHabitsTab();
      }
    }

    function renderHabitsManageList() {
      const container = document.getElementById('habit-manage-list');
      container.innerHTML = '';
      appState.habits.forEach(h => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 bg-slate-800/40 border border-slate-700/50 rounded-xl";
        item.innerHTML = `
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full" style="background-color: ${h.color}"></div>
            <span class="font-semibold text-slate-200 text-xs">${h.name}</span>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="editHabit('${h.id}')" class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg">
              <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="deleteHabit('${h.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-700 rounded-lg">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    // SETTINGS MODAL (EXERCISES)
    function openSettingsModal() {
      document.getElementById('modal-settings').classList.remove('hidden');
      renderSettingsModal();
    }

    function closeSettingsModal() {
      document.getElementById('modal-settings').classList.add('hidden');
    }

    function renderSettingsModal() {
      const containerA = document.getElementById('settings-exercises-a');
      const containerB = document.getElementById('settings-exercises-b');
      
      containerA.innerHTML = appState.workoutA.map((ex, i) => `
        <div>
          <input type="text" id="ex-a-${i}" value="${ex.name}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
        </div>
      `).join('');

      containerB.innerHTML = appState.workoutB.map((ex, i) => `
        <div>
          <input type="text" id="ex-b-${i}" value="${ex.name}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
        </div>
      `).join('');
    }

    function saveExerciseSettings() {
      appState.workoutA.forEach((ex, i) => {
        const val = document.getElementById(`ex-a-${i}`).value.trim();
        if (val) ex.name = val;
      });
      appState.workoutB.forEach((ex, i) => {
        const val = document.getElementById(`ex-b-${i}`).value.trim();
        if (val) ex.name = val;
      });
      saveState();
      closeSettingsModal();
      renderWorkout();
      alert('Názvy cvikov boli uložene.');
    }

    // HISTORY RENDER LOGIC WITH EXPANDABLE DETAILS
    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (!appState.history || appState.history.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs">Zatiaľ žiadne odcvičené tréningy.</div>`;
        return;
      }

      appState.history.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/40 border border-slate-700/50 rounded-xl overflow-hidden";

        let exercisesListHTML = '';
        if (item.exercises && Array.isArray(item.exercises)) {
          exercisesListHTML = item.exercises.map(ex => 
            `<div class="text-slate-300 text-xs py-0.5">${ex.name}: <span class="font-semibold text-blue-400">${ex.weight} kg</span> (${ex.logs.join(', ')})</div>`
          ).join('');
        } else if (item.details && Array.isArray(item.details)) {
          exercisesListHTML = item.details.map(d => 
            `<div class="text-slate-300 text-xs py-0.5">${d}</div>`
          ).join('');
        }

        card.innerHTML = `
          <details class="group">
            <summary class="flex items-center justify-between p-3 cursor-pointer select-none hover:bg-slate-800/60 transition">
              <div class="flex items-center gap-2">
                <span class="font-bold text-white text-sm">Tréning ${item.routine}</span>
                <span class="text-xs text-slate-400 font-medium">${item.date}</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180"></i>
              </div>
              <button onclick="deleteHistoryItem(event, ${index})" class="text-slate-500 hover:text-rose-400 p-1 transition" title="Vymazať z histórie">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </summary>
            <div class="px-3 pb-3 pt-2 border-t border-slate-700/40 space-y-1 bg-slate-900/40">
              ${exercisesListHTML}
            </div>
          </details>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function deleteHistoryItem(e, index) {
      e.stopPropagation();
      e.preventDefault();
      if (confirm('Chceš vymazať tento tréning z histórie?')) {
        appState.history.splice(index, 1);
        saveState();
        renderHistory();
      }
    }

    // EXPORT DATA
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `gymtrack_backup_${getTodayStr()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
