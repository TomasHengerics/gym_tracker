<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym Tracker</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Manifest inline -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Gym Tracker","short_name":"GymTrack","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2964/2964514.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: text; }
    .custom-scrollbar::-webkit-scrollbar { display: none; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Skrytie predvolenej šípky prehliadača pre details */
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md shadow-blue-900/30">
        <i data-lucide="dumbbell" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">Gym Tracker</h1>
        <p class="text-xs text-slate-400" id="current-date-display"></p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="openSettingsModal()" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition rounded-xl text-slate-300 border border-slate-700">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
      <button onclick="exportData()" class="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 transition rounded-xl text-slate-300 border border-slate-700">
        <i data-lucide="download" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Navigation Tabs -->
    <div class="grid grid-cols-2 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
      <button onclick="switchTab('workout')" id="tab-btn-workout" class="py-2 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow">
        Tréning
      </button>
      <button onclick="switchTab('history')" id="tab-btn-history" class="py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
        História
      </button>
    </div>

    <!-- TAB 1: WORKOUT -->
    <section id="tab-workout" class="space-y-4">
      <!-- Routine Selector -->
      <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button onclick="selectRoutine('A')" id="btn-routine-a" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700">
          Tréning A
        </button>
        <button onclick="selectRoutine('B')" id="btn-routine-b" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white">
          Tréning B
        </button>
      </div>

      <!-- Workout Cards Container -->
      <div id="workout-exercises-container" class="space-y-4">
        <!-- Injected via JS -->
      </div>

      <button onclick="finishWorkout()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-98 text-white font-bold rounded-xl shadow-lg shadow-blue-900/40 flex items-center justify-center gap-2">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Dokončiť Tréning
      </button>
    </section>

    <!-- TAB 2: HISTORY -->
    <section id="tab-history" class="space-y-4 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h2 class="text-base font-bold text-white mb-3 flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-blue-400"></i> Odcvičené Tréningy
        </h2>
        <div id="history-list" class="space-y-3 text-xs">
          <!-- History items injected via JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL: SETTINGS (Edit Exercises & Weight Increments) -->
  <div id="modal-settings" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i data-lucide="settings" class="w-5 h-5 text-blue-400"></i> Nastavenia Cvikov
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="p-4 overflow-y-auto space-y-6 custom-scrollbar text-xs">
        <div>
          <h4 class="font-bold text-blue-400 text-sm mb-3">Tréning A</h4>
          <div id="settings-exercises-a" class="space-y-3"></div>
        </div>
        <div>
          <h4 class="font-bold text-blue-400 text-sm mb-3">Tréning B</h4>
          <div id="settings-exercises-b" class="space-y-3"></div>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex gap-2">
        <button onclick="saveExerciseSettings()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white text-xs shadow">
          Uložiť Nastavenia
        </button>
      </div>
    </div>
  </div>

  <script>
    // Default Initial Data
    const defaultData = {
      workoutA: [
        { id: 'a1', name: 'Hack squat / leg press', sets: 2, targetReps: 6, weight: 70, inc: 2.5, logs: [6, 6] },
        { id: 'a2', name: 'Romanian deadlift', sets: 2, targetReps: 8, weight: 90, inc: 2.5, logs: [8, 8] },
        { id: 'a3', name: 'Smith machine chest press 90 / dips', sets: 2, targetReps: 8, weight: 27, inc: 2.5, logs: [8, 8] },
        { id: 'a4', name: 'Weighted pull-up / Lat pulldown', sets: 2, targetReps: 8, weight: 0, inc: 2.5, logs: [6, 6] },
        { id: 'a5', name: 'Peck deck', sets: 2, targetReps: 8, weight: 80, inc: 2.5, logs: [8, 8] },
        { id: 'a6', name: 'Biceps curl (cable / incline)', sets: 2, targetReps: 10, weight: 55, inc: 2.5, logs: [10, 10] },
        { id: 'a7', name: 'Back extension', sets: 1, targetReps: 100, weight: 0, inc: 2.5, logs: [60] },
        { id: 'a8', name: 'Ab crunch', sets: 2, targetReps: 12, weight: 47, inc: 2.5, logs: [12, 12] }
      ],
      workoutB: [
        { id: 'b1', name: 'Leg extension one leg', sets: 2, targetReps: 12, weight: 59, inc: 2.5, logs: [12, 12] },
        { id: 'b2', name: 'Chest-supported row / T-bar row', sets: 2, targetReps: 10, weight: 60, inc: 2.5, logs: [10, 10] },
        { id: 'b3', name: 'Smith shoulder press', sets: 2, targetReps: 8, weight: 80, inc: 2.5, logs: [8, 8] },
        { id: 'b4', name: 'Seated leg curl', sets: 2, targetReps: 12, weight: 66, inc: 2.5, logs: [12, 12] },
        { id: 'b5', name: 'Seated good morning', sets: 2, targetReps: 12, weight: 25, inc: 2.5, logs: [12, 12] },
        { id: 'b6', name: 'Overhead triceps extension / 1 arm extension', sets: 2, targetReps: 10, weight: 17, inc: 2.5, logs: [10, 10] },
        { id: 'b7', name: 'Lateral raise', sets: 2, targetReps: 15, weight: 8, inc: 2.5, logs: [15, 15] },
        { id: 'b8', name: 'Ab crunch', sets: 2, targetReps: 12, weight: 12.5, inc: 2.5, logs: [12, 12] }
      ],
      history: []
    };

    let appState = JSON.parse(localStorage.getItem('gymTrackState')) || defaultData;
    if (!appState.history) appState.history = [];

    // Auto-fix/migration for old local data structure
    ['workoutA', 'workoutB'].forEach(key => {
      if (appState[key]) {
        appState[key].forEach(ex => {
          if (ex.inc === undefined) ex.inc = 2.5;
          if (ex.name.toLowerCase().includes('chest-supported row') && ex.sets === 3) {
            ex.sets = 2;
            ex.logs = ex.logs.slice(0, 2);
          }
          if (ex.name.toLowerCase().includes('lateral raise') && ex.sets === 1) {
            ex.sets = 2;
            if (ex.logs.length < 2) ex.logs.push(ex.logs[0] || 15);
          }
        });
      }
    });

    let activeRoutine = 'A';

    function saveState() {
      localStorage.setItem('gymTrackState', JSON.stringify(appState));
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('sk-SK', { weekday: 'short', month: 'short', day: 'numeric' });
      renderWorkout();
      renderHistory();
      lucide.createIcons();
    });

    // NAVIGATION TABS
    function switchTab(tab) {
      ['workout', 'history'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = "py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      activeBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow";
    }

    // ROUTINE & WORKOUT LOGIC
    function selectRoutine(r) {
      activeRoutine = r;
      const btnA = document.getElementById('btn-routine-a');
      const btnB = document.getElementById('btn-routine-b');
      if (r === 'A') {
        btnA.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700 shadow";
        btnB.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white";
      } else {
        btnB.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700 shadow";
        btnA.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white";
      }
      renderWorkout();
    }

    // Calculate how many times this exercise was performed with current weight in history
    function getWeightOccurrenceCount(exName, currentWeight) {
      let count = 0;
      for (const item of appState.history) {
        if (!item.exercises) continue;
        const found = item.exercises.find(e => e.name === exName);
        if (found) {
          if (found.weight === currentWeight) {
            count++;
          } else {
            break; // Stop when weight was different
          }
        }
      }
      return count;
    }

    function renderWorkout() {
      const list = activeRoutine === 'A' ? appState.workoutA : appState.workoutB;
      const container = document.getElementById('workout-exercises-container');
      container.innerHTML = '';

      list.forEach((ex, exIdx) => {
        let isCeilingMet = ex.logs.length >= ex.sets && ex.logs.every(r => r >= ex.targetReps);
        let incVal = ex.inc !== undefined ? ex.inc : 2.5;
        let nextWeightText = isCeilingMet ? `Cieľ splnený! Prihoď na ${ex.weight + incVal} kg` : `Nechaj ${ex.weight} kg`;
        
        let weightCount = getWeightOccurrenceCount(ex.name, ex.weight);

        let setInputsHTML = '';
        for (let s = 0; s < ex.sets; s++) {
          const currentVal = ex.logs[s] !== undefined ? ex.logs[s] : 0;
          setInputsHTML += `
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-slate-400 font-medium">S${s+1}:</span>
              <button onclick="changeReps('${activeRoutine}', ${exIdx}, ${s}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center text-sm border border-slate-700">-</button>
              <span class="w-8 text-center text-sm font-bold text-white">${currentVal}</span>
              <button onclick="changeReps('${activeRoutine}', ${exIdx}, ${s}, 1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center text-sm border border-slate-700">+</button>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-sm";
        card.innerHTML = `
          <!-- Name Top, Weight Controls Right -->
          <div class="flex items-start justify-between gap-3">
            <div class="space-y-0.5">
              <h3 class="font-bold text-base text-slate-100 leading-snug">${ex.name}</h3>
              <p class="text-xs text-slate-400 font-medium">Cieľ: ${ex.targetReps}${ex.name.toLowerCase().includes('back extension') ? 's' : ' op.'}</p>
            </div>
            
            <!-- Weight Controls with Editable Input -->
            <div class="shrink-0 flex items-center gap-1">
              <button onclick="changeWeight('${activeRoutine}', ${exIdx}, -1)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center text-xs border border-slate-700">-</button>
              <div class="flex items-center gap-0.5">
                <input type="number" step="any" value="${ex.weight}" onchange="updateWeightDirect('${activeRoutine}', ${exIdx}, this.value)" class="w-14 bg-slate-800 text-center font-extrabold text-blue-400 border border-slate-700 rounded-lg py-1 text-sm focus:outline-none focus:border-blue-500 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                <span class="text-xs text-slate-400 font-bold">kg</span>
              </div>
              <button onclick="changeWeight('${activeRoutine}', ${exIdx}, 1)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold flex items-center justify-center text-xs border border-slate-700">+</button>
            </div>
          </div>

          <!-- Series Reps Row -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
            ${setInputsHTML}
          </div>

          <!-- Bottom Status Row: Left Counter, Right Recommendation -->
          <div class="pt-2 border-t border-slate-800/60 flex items-center justify-between gap-2 text-[11px]">
            <div class="flex items-center gap-1.5 text-slate-400 bg-slate-800/40 px-2 py-1 rounded-lg border border-slate-700/40">
              <i data-lucide="repeat" class="w-3.5 h-3.5 text-blue-400"></i>
              <span>Odcvičené: <strong class="text-slate-200 font-bold">${weightCount}x</strong></span>
            </div>

            <div class="flex items-center gap-1.5 ${isCeilingMet ? 'text-emerald-400 bg-emerald-950/40 border border-emerald-800/40' : 'text-slate-400 bg-slate-800/30'} px-2 py-1 rounded-lg">
              <i data-lucide="${isCeilingMet ? 'trending-up' : 'minus'}" class="w-3.5 h-3.5 shrink-0"></i>
              <span>${nextWeightText}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function changeReps(routine, exIdx, setIdx, delta) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      if (!list[exIdx].logs[setIdx]) list[exIdx].logs[setIdx] = 0;
      list[exIdx].logs[setIdx] = Math.max(0, list[exIdx].logs[setIdx] + delta);
      saveState();
      renderWorkout();
    }

    function changeWeight(routine, exIdx, direction) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      const inc = list[exIdx].inc !== undefined ? list[exIdx].inc : 2.5;
      const amount = direction > 0 ? inc : -inc;
      list[exIdx].weight = Math.max(0, Math.round((list[exIdx].weight + amount) * 100) / 100);
      saveState();
      renderWorkout();
    }

    function updateWeightDirect(routine, exIdx, val) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      const num = parseFloat(val);
      if (!isNaN(num) && num >= 0) {
        list[exIdx].weight = num;
        saveState();
        renderWorkout();
      }
    }

    function finishWorkout() {
      const list = activeRoutine === 'A' ? appState.workoutA : appState.workoutB;
      
      const loggedExercises = list.map(e => ({
        name: e.name,
        weight: e.weight,
        logs: [...e.logs]
      }));

      list.forEach(ex => {
        let isCeilingMet = ex.logs.length >= ex.sets && ex.logs.every(r => r >= ex.targetReps);
        if (isCeilingMet) {
          const inc = ex.inc !== undefined ? ex.inc : 2.5;
          ex.weight = ex.weight + inc;
        }
      });

      const todayStr = new Date().toLocaleDateString('sk-SK');
      appState.history.unshift({
        date: todayStr,
        routine: activeRoutine,
        exercises: loggedExercises
      });

      saveState();
      alert(`Tréning ${activeRoutine} dokončený! Váhy sa automaticky upravili pre budúci tréning.`);
      renderWorkout();
      renderHistory();
    }

    // SETTINGS MODAL (EXERCISES & INCREMENTS)
    function openSettingsModal() {
      document.getElementById('modal-settings').classList.remove('hidden');
      renderSettingsModal();
    }

    function closeSettingsModal() {
      document.getElementById('modal-settings').classList.add('hidden');
    }

    function renderSettingsModal() {
      const containerA = document.getElementById('settings-exercises-a');
      const containerB = document.getElementById('settings-exercises-b');
      
      containerA.innerHTML = appState.workoutA.map((ex, i) => `
        <div class="p-2.5 bg-slate-800/50 border border-slate-700/60 rounded-xl space-y-2">
          <div>
            <label class="block text-slate-400 text-[10px] uppercase font-bold mb-1">Názov cviku</label>
            <input type="text" id="ex-a-name-${i}" value="${ex.name}" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] uppercase font-bold mb-1">Prírastok váhy (+/- kg)</label>
            <input type="number" step="0.5" id="ex-a-inc-${i}" value="${ex.inc !== undefined ? ex.inc : 2.5}" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
          </div>
        </div>
      `).join('');

      containerB.innerHTML = appState.workoutB.map((ex, i) => `
        <div class="p-2.5 bg-slate-800/50 border border-slate-700/60 rounded-xl space-y-2">
          <div>
            <label class="block text-slate-400 text-[10px] uppercase font-bold mb-1">Názov cviku</label>
            <input type="text" id="ex-b-name-${i}" value="${ex.name}" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 text-[10px] uppercase font-bold mb-1">Prírastok váhy (+/- kg)</label>
            <input type="number" step="0.5" id="ex-b-inc-${i}" value="${ex.inc !== undefined ? ex.inc : 2.5}" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-blue-500">
          </div>
        </div>
      `).join('');
    }

    function saveExerciseSettings() {
      appState.workoutA.forEach((ex, i) => {
        const nameVal = document.getElementById(`ex-a-name-${i}`).value.trim();
        const incVal = parseFloat(document.getElementById(`ex-a-inc-${i}`).value);
        if (nameVal) ex.name = nameVal;
        if (!isNaN(incVal) && incVal >= 0) ex.inc = incVal;
      });
      appState.workoutB.forEach((ex, i) => {
        const nameVal = document.getElementById(`ex-b-name-${i}`).value.trim();
        const incVal = parseFloat(document.getElementById(`ex-b-inc-${i}`).value);
        if (nameVal) ex.name = nameVal;
        if (!isNaN(incVal) && incVal >= 0) ex.inc = incVal;
      });
      saveState();
      closeSettingsModal();
      renderWorkout();
      alert('Nastavenia boli uložené.');
    }

    // HISTORY RENDER LOGIC
    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (!appState.history || appState.history.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-slate-500 text-xs">Zatiaľ žiadne odcvičené tréningy.</div>`;
        return;
      }

      appState.history.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/40 border border-slate-700/50 rounded-xl overflow-hidden";

        let exercisesListHTML = '';
        if (item.exercises && Array.isArray(item.exercises)) {
          exercisesListHTML = item.exercises.map(ex => 
            `<div class="text-slate-300 text-xs py-0.5">${ex.name}: <span class="font-semibold text-blue-400">${ex.weight} kg</span> (${ex.logs.join(', ')})</div>`
          ).join('');
        }

        card.innerHTML = `
          <details class="group">
            <summary class="flex items-center justify-between p-3 cursor-pointer select-none hover:bg-slate-800/60 transition">
              <div class="flex items-center gap-2">
                <span class="font-bold text-white text-sm">Tréning ${item.routine}</span>
                <span class="text-xs text-slate-400 font-medium">${item.date}</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180"></i>
              </div>
              <button onclick="deleteHistoryItem(event, ${index})" class="text-slate-500 hover:text-rose-400 p-1 transition" title="Vymazať z histórie">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </summary>
            <div class="px-3 pb-3 pt-2 border-t border-slate-700/40 space-y-1 bg-slate-900/40">
              ${exercisesListHTML}
            </div>
          </details>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function deleteHistoryItem(e, index) {
      e.stopPropagation();
      e.preventDefault();
      if (confirm('Chceš vymazať tento tréning z histórie?')) {
        appState.history.splice(index, 1);
        saveState();
        renderHistory();
        renderWorkout();
      }
    }

    // EXPORT DATA
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `gymtrack_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
