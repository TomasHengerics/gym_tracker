<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gym & Habit Tracker</title>
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Manifest inline -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Gym %26 Habit Tracker","short_name":"GymTrack","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2964/2964514.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input { user-select: text; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 p-2 rounded-xl text-white">
        <i data-lucide="dumbbell" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">Gym & Habit Tracker</h1>
        <p class="text-xs text-slate-400" id="current-date-display"></p>
      </div>
    </div>
    <button onclick="exportData()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300 text-xs flex items-center gap-1">
      <i data-lucide="download" class="w-4 h-4"></i> Zalohovať
    </button>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Navigation Tabs -->
    <div class="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
      <button onclick="switchTab('workout')" id="tab-btn-workout" class="py-2 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow">
        Tréning
      </button>
      <button onclick="switchTab('habits')" id="tab-btn-habits" class="py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
        Návyky
      </button>
      <button onclick="switchTab('history')" id="tab-btn-history" class="py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white">
        História
      </button>
    </div>

    <!-- TAB 1: WORKOUT -->
    <section id="tab-workout" class="space-y-4">
      <!-- Routine Selector -->
      <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button onclick="selectRoutine('A')" id="btn-routine-a" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700">
          Tréning A
        </button>
        <button onclick="selectRoutine('B')" id="btn-routine-b" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white">
          Tréning B
        </button>
      </div>

      <!-- Workout Cards Container -->
      <div id="workout-exercises-container" class="space-y-4">
        <!-- Injected via JS -->
      </div>

      <button onclick="finishWorkout()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-blue-900/40 flex items-center justify-center gap-2">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i> Dokončiť Tréning
      </button>
    </section>

    <!-- TAB 2: HABITS -->
    <section id="tab-habits" class="space-y-4 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="droplet" class="w-5 h-5 text-blue-400"></i> Pitný Režim (Voda)
        </h2>
        
        <div class="space-y-2">
          <div class="flex justify-between items-end">
            <span class="text-2xl font-extrabold text-blue-400"><span id="water-val">0</span> / 3.0 L</span>
            <span class="text-xs text-slate-400" id="water-pct">0% cieľa</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
            <div id="water-bar" class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button onclick="addWater(0.25)" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-blue-300 font-medium rounded-xl text-xs flex items-center justify-center gap-1 border border-slate-700">
            +0.25 L
          </button>
          <button onclick="addWater(0.5)" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-blue-300 font-medium rounded-xl text-xs flex items-center justify-center gap-1 border border-slate-700">
            +0.50 L
          </button>
          <button onclick="resetWater()" class="py-2.5 bg-slate-800/50 hover:bg-slate-800 text-slate-400 font-medium rounded-xl text-xs flex items-center justify-center border border-slate-800">
            Vynulovať
          </button>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="moon" class="w-5 h-5 text-indigo-400"></i> Spánok & Regenerácia
        </h2>
        <label class="flex items-center justify-between p-3 bg-slate-800/50 border border-slate-800 rounded-xl cursor-pointer">
          <span class="text-sm font-medium text-slate-200">Išiel som spať na čas (napr. pred 23:00)</span>
          <input type="checkbox" id="sleep-checkbox" onchange="toggleSleep(this.checked)" class="w-5 h-5 accent-blue-600 rounded">
        </label>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i data-lucide="activity" class="w-5 h-5 text-emerald-400"></i> Dnešný Tréning
        </h2>
        <div id="workout-habit-status" class="p-3 bg-slate-800/30 rounded-xl text-xs text-slate-400 flex items-center justify-between">
          <span>Stav tréningu:</span>
          <span id="workout-status-badge" class="px-2 py-1 rounded font-bold text-slate-400 bg-slate-800">Zatiaľ neodcvičené</span>
        </div>
      </div>
    </section>

    <!-- TAB 3: HISTORY -->
    <section id="tab-history" class="space-y-4 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h2 class="text-base font-bold text-white mb-3 flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-blue-400"></i> Odcvičené Tréningy
        </h2>
        <div id="history-list" class="space-y-3 text-xs">
          <!-- History items injected via JS -->
        </div>
      </div>
    </section>
  </main>

  <script>
    // Initial Data Structures based on uploaded tables
    const defaultData = {
      workoutA: [
        { id: 'a1', name: 'Hack squat / leg press', type: 'Veľký', sets: 2, minReps: 5, targetReps: 6, weight: 70, inc: 2.5, logs: [6, 6] },
        { id: 'a2', name: 'Romanian deadlift', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 90, inc: 2.5, logs: [8, 8] },
        { id: 'a3', name: 'Smith machine chest press 90 / dips', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 27, inc: 2.5, logs: [8, 8] },
        { id: 'a4', name: 'Weighted pull-up / Lat pulldown', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 0, inc: 2.5, logs: [6, 6] },
        { id: 'a5', name: 'Peck deck', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 80, inc: 2.5, logs: [8, 8] },
        { id: 'a6', name: 'Biceps curl (cable / incline)', type: 'Malý', sets: 2, minReps: 6, targetReps: 10, weight: 55, inc: 1.5, logs: [10, 10] },
        { id: 'a7', name: 'Back extension', type: 'Čas', sets: 1, minReps: 0, targetReps: 100, weight: 0, inc: 1.5, logs: [60] },
        { id: 'a8', name: 'Ab crunch', type: 'Malý', sets: 2, minReps: 12, targetReps: 12, weight: 47, inc: 1.5, logs: [12, 12] }
      ],
      workoutB: [
        { id: 'b1', name: 'Leg extension one leg', type: 'Veľký', sets: 2, minReps: 8, targetReps: 12, weight: 59, inc: 2.5, logs: [12, 12] },
        { id: 'b2', name: 'Chest-supported row / T-bar row', type: 'Veľký', sets: 3, minReps: 6, targetReps: 10, weight: 60, inc: 2.5, logs: [10, 10, 10] },
        { id: 'b3', name: 'Smith shoulder press', type: 'Veľký', sets: 2, minReps: 5, targetReps: 8, weight: 80, inc: 2.5, logs: [8, 8] },
        { id: 'b4', name: 'Seated leg curl', type: 'Veľký', sets: 2, minReps: 8, targetReps: 12, weight: 66, inc: 2.5, logs: [12, 12] },
        { id: 'b5', name: 'Seated good morning', type: 'Veľký', sets: 2, minReps: 8, targetReps: 12, weight: 25, inc: 2.5, logs: [12, 12] },
        { id: 'b6', name: 'Overhead triceps extension / 1 arm extension', type: 'Malý', sets: 2, minReps: 6, targetReps: 10, weight: 17, inc: 1.5, logs: [10, 10] },
        { id: 'b7', name: 'Lateral raise', type: 'Malý', sets: 1, minReps: 10, targetReps: 15, weight: 8, inc: 1.5, logs: [15] },
        { id: 'b8', name: 'Ab crunch', type: 'Malý', sets: 2, minReps: 12, targetReps: 12, weight: 12.5, inc: 1.5, logs: [12, 12] }
      ],
      habits: {
        water: 0,
        sleep: false
      },
      history: []
    };

    // Load from LocalStorage
    let appState = JSON.parse(localStorage.getItem('gymTrackState')) || defaultData;
    let activeRoutine = 'A';

    function saveState() {
      localStorage.setItem('gymTrackState', JSON.stringify(appState));
    }

    // Init display
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('sk-SK', { weekday: 'short', month: 'short', day: 'numeric' });
      renderWorkout();
      renderHabits();
      renderHistory();
      lucide.createIcons();
    });

    function switchTab(tab) {
      ['workout', 'habits', 'history'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = "py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-white";
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      activeBtn.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-blue-600 text-white shadow";
    }

    function selectRoutine(r) {
      activeRoutine = r;
      const btnA = document.getElementById('btn-routine-a');
      const btnB = document.getElementById('btn-routine-b');
      if (r === 'A') {
        btnA.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700 shadow";
        btnB.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white";
      } else {
        btnB.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-slate-800 text-blue-400 border border-slate-700 shadow";
        btnA.className = "flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-white";
      }
      renderWorkout();
    }

    function renderWorkout() {
      const list = activeRoutine === 'A' ? appState.workoutA : appState.workoutB;
      const container = document.getElementById('workout-exercises-container');
      container.innerHTML = '';

      list.forEach((ex, exIdx) => {
        // Ceiling check logic
        let isCeilingMet = false;
        if (ex.type === 'Čas') {
          isCeilingMet = ex.logs[0] >= ex.targetReps;
        } else {
          isCeilingMet = ex.logs.length >= ex.sets && ex.logs.every(r => r >= ex.targetReps);
        }

        let nextWeightText = '';
        if (isCeilingMet) {
          const nextW = ex.weight + ex.inc;
          nextWeightText = `Cieľ splnený! Prihoď na ${nextW} kg`;
        } else {
          nextWeightText = `Nechaj ${ex.weight} kg`;
        }

        let setInputsHTML = '';
        for (let s = 0; s < ex.sets; s++) {
          const currentVal = ex.logs[s] !== undefined ? ex.logs[s] : 0;
          setInputsHTML += `
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-slate-400 font-medium">S${s+1}:</span>
              <button onclick="changeReps('${activeRoutine}', ${exIdx}, ${s}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center text-sm border border-slate-700">-</button>
              <span class="w-8 text-center text-sm font-bold text-white">${currentVal}</span>
              <button onclick="changeReps('${activeRoutine}', ${exIdx}, ${s}, 1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold flex items-center justify-center text-sm border border-slate-700">+</button>
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded ${ex.type === 'Veľký' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : ex.type === 'Malý' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' : 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20'}">
                  ${ex.type}
                </span>
                <span class="text-xs text-slate-400">${ex.sets} séria / cieľ ${ex.targetReps}${ex.type === 'Čas' ? 's' : ' op.'}</span>
              </div>
              <h3 class="font-bold text-sm text-slate-100 mt-1">${ex.name}</h3>
            </div>
            <div class="text-right">
              <div class="flex items-center justify-end gap-1">
                <button onclick="changeWeight('${activeRoutine}', ${exIdx}, -2.5)" class="text-slate-400 hover:text-white px-1 font-bold text-xs">-</button>
                <span class="text-base font-extrabold text-blue-400">${ex.weight} kg</span>
                <button onclick="changeWeight('${activeRoutine}', ${exIdx}, 2.5)" class="text-slate-400 hover:text-white px-1 font-bold text-xs">+</button>
              </div>
            </div>
          </div>

          <!-- Reps Controls -->
          <div class="flex items-center justify-between pt-1 border-t border-slate-800/80">
            ${setInputsHTML}
          </div>

          <!-- Status indicator -->
          <div class="mt-2 text-[11px] p-2 rounded-xl flex items-center gap-2 ${isCeilingMet ? 'bg-emerald-950/40 text-emerald-400 border border-emerald-800/40' : 'bg-slate-800/40 text-slate-400'}">
            <i data-lucide="${isCeilingMet ? 'trending-up' : 'minus'}" class="w-4 h-4 shrink-0"></i>
            <span>${nextWeightText}</span>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function changeReps(routine, exIdx, setIdx, delta) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      if (!list[exIdx].logs[setIdx]) list[exIdx].logs[setIdx] = 0;
      list[exIdx].logs[setIdx] = Math.max(0, list[exIdx].logs[setIdx] + delta);
      saveState();
      renderWorkout();
    }

    function changeWeight(routine, exIdx, delta) {
      const list = routine === 'A' ? appState.workoutA : appState.workoutB;
      list[exIdx].weight = Math.max(0, list[exIdx].weight + delta);
      saveState();
      renderWorkout();
    }

    function finishWorkout() {
      const list = activeRoutine === 'A' ? appState.workoutA : appState.workoutB;
      
      // Auto-update weights if ceiling met
      list.forEach(ex => {
        let isCeilingMet = false;
        if (ex.type === 'Čas') {
          isCeilingMet = ex.logs[0] >= ex.targetReps;
        } else {
          isCeilingMet = ex.logs.length >= ex.sets && ex.logs.every(r => r >= ex.targetReps);
        }
        if (isCeilingMet) {
          ex.weight = ex.weight + ex.inc;
        }
      });

      const todayStr = new Date().toLocaleDateString('sk-SK');
      appState.history.unshift({
        date: todayStr,
        routine: activeRoutine,
        details: list.map(e => `${e.name}: ${e.weight}kg (${e.logs.join('/')})`)
      });

      saveState();
      alert(`Tréning ${activeRoutine} bol úspešne dokončený a uložený! Odporúčané váhy sa automaticky navýšili pre budúci tréning.`);
      renderWorkout();
      renderHabits();
      renderHistory();
    }

    // HABITS LOGIC
    function addWater(val) {
      appState.habits.water = Math.min(5.0, (appState.habits.water || 0) + val);
      saveState();
      renderHabits();
    }

    function resetWater() {
      appState.habits.water = 0;
      saveState();
      renderHabits();
    }

    function toggleSleep(checked) {
      appState.habits.sleep = checked;
      saveState();
    }

    function renderHabits() {
      const w = appState.habits.water || 0;
      document.getElementById('water-val').innerText = w.toFixed(2);
      const pct = Math.min(100, Math.round((w / 3.0) * 100));
      document.getElementById('water-pct').innerText = `${pct}% cieľa`;
      document.getElementById('water-bar').style.width = `${pct}%`;

      document.getElementById('sleep-checkbox').checked = !!appState.habits.sleep;

      const todayStr = new Date().toLocaleDateString('sk-SK');
      const trainedToday = appState.history.some(h => h.date === todayStr);
      const badge = document.getElementById('workout-status-badge');
      if (trainedToday) {
        badge.innerText = "Odcvičené ✔";
        badge.className = "px-2 py-1 rounded font-bold text-emerald-400 bg-emerald-950 border border-emerald-800/50";
      } else {
        badge.innerText = "Zatiaľ neodcvičené";
        badge.className = "px-2 py-1 rounded font-bold text-slate-400 bg-slate-800";
      }
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';
      if (!appState.history || appState.history.length === 0) {
        container.innerHTML = '<p class="text-slate-500 italic">Zatiaľ nemáš žiadne uložené tréningy.</p>';
        return;
      }

      appState.history.forEach(item => {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-800/40 border border-slate-800 rounded-xl space-y-1";
        div.innerHTML = `
          <div class="flex justify-between items-center font-bold text-slate-200">
            <span>Tréning ${item.routine}</span>
            <span class="text-slate-400 text-[11px] font-normal">${item.date}</span>
          </div>
          <div class="text-[11px] text-slate-400 leading-relaxed">
            ${item.details.join(' • ')}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `gym_track_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
